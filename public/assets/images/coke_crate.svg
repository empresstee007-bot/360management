<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Liquid Gradient -->
    <linearGradient id="colaLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="50%" stop-color="#2d0808"/>
      <stop offset="100%" stop-color="#120303"/>
    </linearGradient>
    <!-- Label Gradient -->
    <linearGradient id="cokeRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e61d2b"/>
      <stop offset="100%" stop-color="#b80f1a"/>
    </linearGradient>
    <!-- Plastic Wrap Highlight -->
    <linearGradient id="wrapHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Cap Gradient -->
    <linearGradient id="capRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f82c39"/>
      <stop offset="50%" stop-color="#c4121f"/>
      <stop offset="100%" stop-color="#8a0811"/>
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="packShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#packShadow)">
    <!-- Base Shadow -->
    <ellipse cx="100" cy="180" rx="85" ry="12" fill="#0f172a" opacity="0.2"/>

    <!-- BACK ROW BOTTLES (Offset) -->
    <!-- Back Bottle 1 (Left) -->
    <g transform="translate(32, 18) scale(0.85)">
      <rect x="25" y="10" width="16" height="14" rx="2" fill="url(#capRed)"/>
      <path d="M22,24 C22,35 15,45 15,65 L15,145 C15,155 25,160 33,160 C41,160 51,155 51,145 L51,65 C51,45 44,35 44,24 Z" fill="url(#colaLiquid)"/>
      <path d="M15,80 L51,80 L51,115 L15,115 Z" fill="url(#cokeRed)"/>
    </g>
    <!-- Back Bottle 2 (Center) -->
    <g transform="translate(72, 18) scale(0.85)">
      <rect x="25" y="10" width="16" height="14" rx="2" fill="url(#capRed)"/>
      <path d="M22,24 C22,35 15,45 15,65 L15,145 C15,155 25,160 33,160 C41,160 51,155 51,145 L51,65 C51,45 44,35 44,24 Z" fill="url(#colaLiquid)"/>
      <path d="M15,80 L51,80 L51,115 L15,115 Z" fill="url(#cokeRed)"/>
    </g>
    <!-- Back Bottle 3 (Right) -->
    <g transform="translate(112, 18) scale(0.85)">
      <rect x="25" y="10" width="16" height="14" rx="2" fill="url(#capRed)"/>
      <path d="M22,24 C22,35 15,45 15,65 L15,145 C15,155 25,160 33,160 C41,160 51,155 51,145 L51,65 C51,45 44,35 44,24 Z" fill="url(#colaLiquid)"/>
      <path d="M15,80 L51,80 L51,115 L15,115 Z" fill="url(#cokeRed)"/>
    </g>

    <!-- FRONT ROW BOTTLES (Main) -->
    <!-- Front Bottle 1 (Left) -->
    <g transform="translate(18, 30)">
      <!-- Cap -->
      <rect x="25" y="10" width="18" height="14" rx="3" fill="url(#capRed)"/>
      <line x1="28" y1="10" x2="28" y2="24" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
      <line x1="34" y1="10" x2="34" y2="24" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
      <line x1="40" y1="10" x2="40" y2="24" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
      <!-- Bottle Body -->
      <path d="M24,24 C24,38 14,48 14,70 L14,142 C14,152 22,158 34,158 C46,158 54,152 54,142 L54,70 C54,48 44,38 44,24 Z" fill="url(#colaLiquid)"/>
      <!-- PET Highlights -->
      <path d="M18,70 L18,140" stroke="#ffffff" stroke-width="2.5" opacity="0.25" stroke-linecap="round"/>
      <!-- Red Coca Cola Label -->
      <path d="M14,82 L54,82 L54,120 L14,120 Z" fill="url(#cokeRed)"/>
      <!-- Coca-Cola Script text -->
      <text x="34" y="104" font-family="'Brush Script MT', 'Arial', cursive, sans-serif" font-weight="bold" font-size="14" font-style="italic" fill="#ffffff" text-anchor="middle">Coca-Cola</text>
      <text x="34" y="115" font-family="Arial, sans-serif" font-weight="bold" font-size="6" fill="#ffffff" opacity="0.9" text-anchor="middle">500ml</text>
    </g>

    <!-- Front Bottle 2 (Center) -->
    <g transform="translate(68, 30)">
      <!-- Cap -->
      <rect x="25" y="10" width="18" height="14" rx="3" fill="url(#capRed)"/>
      <line x1="28" y1="10" x2="28" y2="24" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
      <line x1="34" y1="10" x2="34" y2="24" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
      <line x1="40" y1="10" x2="40" y2="24" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
      <!-- Bottle Body -->
      <path d="M24,24 C24,38 14,48 14,70 L14,142 C14,152 22,158 34,158 C46,158 54,152 54,142 L54,70 C54,48 44,38 44,24 Z" fill="url(#colaLiquid)"/>
      <!-- PET Highlights -->
      <path d="M18,70 L18,140" stroke="#ffffff" stroke-width="2.5" opacity="0.25" stroke-linecap="round"/>
      <!-- Red Coca Cola Label -->
      <path d="M14,82 L54,82 L54,120 L14,120 Z" fill="url(#cokeRed)"/>
      <!-- Coca-Cola Script text -->
      <text x="34" y="104" font-family="'Brush Script MT', 'Arial', cursive, sans-serif" font-weight="bold" font-size="14" font-style="italic" fill="#ffffff" text-anchor="middle">Coca-Cola</text>
      <text x="34" y="115" font-family="Arial, sans-serif" font-weight="bold" font-size="6" fill="#ffffff" opacity="0.9" text-anchor="middle">500ml</text>
    </g>

    <!-- Front Bottle 3 (Right) -->
    <g transform="translate(118, 30)">
      <!-- Cap -->
      <rect x="25" y="10" width="18" height="14" rx="3" fill="url(#capRed)"/>
      <line x1="28" y1="10" x2="28" y2="24" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
      <line x1="34" y1="10" x2="34" y2="24" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
      <line x1="40" y1="10" x2="40" y2="24" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
      <!-- Bottle Body -->
      <path d="M24,24 C24,38 14,48 14,70 L14,142 C14,152 22,158 34,158 C46,158 54,152 54,142 L54,70 C54,48 44,38 44,24 Z" fill="url(#colaLiquid)"/>
      <!-- PET Highlights -->
      <path d="M18,70 L18,140" stroke="#ffffff" stroke-width="2.5" opacity="0.25" stroke-linecap="round"/>
      <!-- Red Coca Cola Label -->
      <path d="M14,82 L54,82 L54,120 L14,120 Z" fill="url(#cokeRed)"/>
      <!-- Coca-Cola Script text -->
      <text x="34" y="104" font-family="'Brush Script MT', 'Arial', cursive, sans-serif" font-weight="bold" font-size="14" font-style="italic" fill="#ffffff" text-anchor="middle">Coca-Cola</text>
      <text x="34" y="115" font-family="Arial, sans-serif" font-weight="bold" font-size="6" fill="#ffffff" opacity="0.9" text-anchor="middle">500ml</text>
    </g>

    <!-- CLEAR SHRINK WRAP PLASTIC FILM OVER ENTIRE PACK -->
    <path d="M 28,68 C 24,100 24,140 28,184 C 90,192 110,192 172,184 C 176,140 176,100 172,68 C 120,60 80,60 28,68 Z" fill="url(#wrapHighlight)" stroke="#ffffff" stroke-width="1.5" opacity="0.65"/>
    
    <!-- Plastic Wrap Wrinkles & Reflections -->
    <path d="M 32,80 Q 95,95 168,80" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M 30,135 Q 100,150 170,135" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

    <!-- Side Handle Cutout Opening (Right side of pack) -->
    <ellipse cx="164" cy="125" rx="8" ry="18" fill="#120303" opacity="0.5" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Pack Label Badge -->
    <rect x="68" y="165" width="64" height="16" rx="4" fill="#e61d2b" stroke="#ffffff" stroke-width="1"/>
    <text x="100" y="176" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#ffffff" text-anchor="middle">6 x 50cl PACK</text>
  </g>
</svg>