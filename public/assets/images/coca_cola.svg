<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <radialGradient id="cokeDisc" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ef233c"/>
            <stop offset="85%" stop-color="#d90429"/>
            <stop offset="100%" stop-color="#b7094c"/>
        </radialGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>
    
    <!-- Outer Red Disc -->
    <rect width="200" height="200" fill="url(#cokeDisc)" rx="24"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
    
    <!-- Bottle Outline Contour Silhouette -->
    <path d="M 100 25 C 92 25 90 35 90 48 L 92 82 Q 80 92 80 120 Q 80 155 100 170 Q 120 155 120 120 Q 120 92 108 82 L 110 48 C 110 35 108 25 100 25 Z" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.95"/>
    
    <!-- White Cursive Coca-Cola Script Text Contour -->
    <g transform="translate(20, 75)">
        <text x="80" y="24" text-anchor="middle" fill="#ffffff" font-family="'Brush Script MT', 'Outfit', 'Georgia', cursive" font-size="34" font-weight="bold" font-style="italic" letter-spacing="-1">Coca-Cola</text>
        <path d="M 15 28 C 45 42, 90 44, 145 28 C 110 38, 55 38, 25 28 Z" fill="#ffffff"/>
    </g>
    
    <text x="100" y="142" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="8" font-weight="700" letter-spacing="1.5" opacity="0.9">TRADE MARK ®</text>
</svg>