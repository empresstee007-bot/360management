<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="100%" height="100%">
    <defs>
        <!-- Dark Malt Liquid -->
        <linearGradient id="maltClassicLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1c0a00"/>
            <stop offset="35%" stop-color="#421a03"/>
            <stop offset="70%" stop-color="#78350f"/>
            <stop offset="100%" stop-color="#2a0f02"/>
        </linearGradient>
        <!-- Gold Cap Gradient -->
        <linearGradient id="goldCapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fde047"/>
            <stop offset="50%" stop-color="#eab308"/>
            <stop offset="100%" stop-color="#ca8a04"/>
        </linearGradient>
        <!-- Sunburst Label Gradient -->
        <linearGradient id="sunburstGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ea580c"/>
            <stop offset="45%" stop-color="#f97316"/>
            <stop offset="80%" stop-color="#fef08a"/>
            <stop offset="100%" stop-color="#fbbf24"/>
        </linearGradient>
    </defs>

    <rect width="200" height="400" fill="none"/>

    <!-- Gold Cap with Ridges -->
    <rect x="76" y="22" width="48" height="28" fill="url(#goldCapGrad)" rx="4"/>
    <line x1="82" y1="28" x2="82" y2="44" stroke="#854d0e" stroke-width="2" opacity="0.6"/>
    <line x1="90" y1="28" x2="90" y2="44" stroke="#854d0e" stroke-width="2" opacity="0.6"/>
    <line x1="98" y1="28" x2="98" y2="44" stroke="#854d0e" stroke-width="2" opacity="0.6"/>
    <line x1="106" y1="28" x2="106" y2="44" stroke="#854d0e" stroke-width="2" opacity="0.6"/>

    <!-- Clear Neck Level -->
    <path d="M 82 50 L 118 50 L 126 80 L 74 80 Z" fill="#fff7ed" opacity="0.4"/>

    <!-- Oval Maltina Bottle Contour Body -->
    <path d="M 74 80 L 126 80 Q 155 115 155 170 Q 155 240 148 290 Q 146 345 135 382 L 65 382 Q 54 345 52 290 Q 45 240 45 170 Q 45 115 74 80 Z" fill="url(#maltClassicLiquid)"/>

    <!-- Maltina Sunburst Oval Label Wrapper -->
    <path d="M 45 130 Q 100 110 155 130 Q 152 250 146 270 Q 100 280 54 270 Q 48 250 45 130 Z" fill="url(#sunburstGrad)"/>
    <path d="M 47 135 Q 100 115 153 135 L 150 265 Q 100 275 56 265 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Maltina Classic Typography -->
    <g transform="translate(52, 140)">
        <!-- Orange/Amber Sun graphic background -->
        <circle cx="48" cy="30" r="28" fill="#f97316" opacity="0.8"/>
        <text x="48" y="48" fill="#000000" font-family="'Outfit', Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="0.5">MALTINA</text>
        <text x="48" y="62" fill="#dc2626" font-family="'Brush Script MT', cursive, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">classic</text>
        <text x="48" y="80" fill="#78350f" font-family="Inter, sans-serif" font-size="7" font-weight="800" text-anchor="middle" letter-spacing="1">NON-ALCOHOLIC MALT</text>
    </g>

    <!-- Glass Reflection Line -->
    <path d="M 58 85 Q 68 115 65 170 Q 65 240 60 360" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.4"/>
</svg>